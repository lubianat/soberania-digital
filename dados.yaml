    tipos: [SL, NP]
    maturidade: 5
    qualidade: 5
    adocao: {br: 2, al: 2, eua: 2, eu: 3}
    ponto_forte: O mais seguro; quase não guarda dados
    ponto_fraco: Pouca gente usa no Brasil
    site: https://signal.org
    saiba_antes: 'Igual ao WhatsApp. Comece com um grupo da família.'
    perfil:
      nivel: 1
      aparelhos: aid
      gratis: true
      privacidade: 2
    app:
      android: org.thoughtcrime.securesms
      ios: 874139669
    wikipedia: Signal (software)
  - nome: Matrix / Element
