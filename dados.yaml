# Soberania Digital — lista de alternativas
#
# Edite este arquivo à mão e recarregue a página. Formato YAML: o recuo (espaços) importa.
#
# escolhas: as 10 escolhas do guia, na ordem (nome igual ao da opção + frase curta).
#
# Cada área:
#   area, no_lugar_de, icone (nome do Font Awesome), resumo
#   situacao: troca (dá para trocar) | parte (em parte) | sem (sem opção)
#   opcoes: lista de alternativas
#
# Cada opção:
#   nome
#   tipos: SL software livre · NP sem fins lucrativos · CO cooperativa · EB empresa brasileira
#          PP setor público · LA América Latina · EX estrangeira
#   maturidade, qualidade: 1 a 5
#   adocao: 1 a 5 no Brasil (br), América Latina (al), EUA (eua) e Europa (eu)
#   ponto_forte, ponto_fraco: uma frase cada
#   aviso: opcional (ex.: "Novo", "Big tech", "Bem público digital")
#   site: endereço da própria plataforma (sem link é melhor que link errado)
#   saiba_antes: o que esperar, para evitar frustração
#   perfil:
#     nivel: 1 só trocar de app · 2 mexer em configurações · 3 instalar sistema e servidor
#     aparelhos: letras a (Android), i (iPhone), d (computador)
#     gratis: true/false · privacidade: 0 a 2
#     opcionais: so_profissional, conta_como_brasileiro, big_tech, fora_do_perfil (true)
#   app: android (pacote) e ios (número) — só o app exato
#   wikipedia: título do verbete em português
#   lista: botão "Sites" com vários endereços (nome, url, nota, cadastro)
#   ajuste_nota: troca um fator da nota (soberania, software_livre, social, uso)

escolhas:
- nome: Pix (Banco Central)
  frase: Pagamento público e grátis que já venceu as big techs no Brasil.
- nome: Firefox
  frase: Troca total do Chrome, em 5 minutos.
- nome: Signal
  frase: Mensagens seguras, sem fins lucrativos. Comece com a família.
- nome: Wikipédia
  frase: A maior obra coletiva da internet. Doe ou edite.
- nome: CoMaps
  frase: Mapa livre que funciona até sem internet.
- nome: MEC Livros
  frase: Milhares de livros grátis, com conta gov.br.
- nome: consumidor.gov.br
  frase: Reclamação com resposta obrigatória da empresa.
- nome: Brasil Participativo
  frase: Opine em políticas públicas sem passar por rede social.
- nome: Itaú Cultural Play
  frase: Cinema brasileiro de graça, sem assinatura.
- nome: Mapa da Cultura
  frase: Agenda de cultura perto de você, fora das redes.
