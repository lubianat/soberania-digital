- area: Pagamentos
  no_lugar_de: Apple Pay, Visa, Mastercard
  icone: fa-qrcode
  situacao: troca
  resumo: No Brasil, troca total com Pix e cartão Elo. Para comprar no exterior, ainda é preciso Visa ou Mastercard.
  opcoes:
  - nome: Pix (Banco Central)
    tipos: [PP]
    maturidade: 5
    qualidade: 5
    adocao: {br: 5, al: 2, eua: 1, eu: 1}
    ponto_forte: Grátis e na hora
    ponto_fraco: Muito usado em golpes
    site: https://www.bcb.gov.br/estabilidadefinanceira/pix
    saiba_antes: 'No cartão, até 5% do que você paga fica com bancos e bandeiras como Visa e Mastercard, que são americanas. No Pix não tem cashback, mas o dinheiro vai quase inteiro para quem vende. Já é o jeito mais usado de pagar no Brasil. Cuidado com golpes: confira o nome de quem recebe antes de confirmar.'
    perfil:
      nivel: 1
      aparelhos: ai
      gratis: true
      privacidade: 0
    wikipedia: Pix
    ajuste_nota:
      software_livre: 2
  - nome: Elo
    tipos: [EB]
    maturidade: 5
    qualidade: 4
    adocao: {br: 3, al: 1, eua: 1, eu: 1}
    ponto_forte: Bandeira de cartão brasileira, no lugar de Visa e Mastercard
    ponto_fraco: Pouco aceita fora do país
    site: https://www.elo.com.br
    saiba_antes: Aceito em quase todo o Brasil, mas pouco aceito fora. Para viajar ou comprar em site estrangeiro, tenha também um cartão Visa ou Mastercard.
