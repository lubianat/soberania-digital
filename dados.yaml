      url: https://element.io
      nota: O app mais usado
    - nome: Matrix
      url: https://matrix.org
      nota: O protocolo, com lista de servidores
  - nome: Delta Chat
    tipos: [SL]
    maturidade: 4
    qualidade: 3
    adocao: {br: 1, al: 1, eua: 1, eu: 2}
    ponto_forte: Mensageiro livre que usa o e-mail, sem número de telefone
    ponto_fraco: Pouca gente usa
